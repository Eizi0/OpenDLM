name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opendlm
          POSTGRES_PASSWORD: opendlm
          POSTGRES_DB: opendlm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opendlm" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENDLM_TEST_DATABASE_URL: postgresql+psycopg://opendlm:opendlm@localhost:5432/opendlm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opendlm:ci .
