<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpenDLM{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><circle cx="12" cy="11" r="2.4"/></svg></span>
      OpenDLM
    </div>
    <nav class="nav">
      <a href="/" class="{% block nav_home %}{% endblock %}">Tableau de bord</a>
      <a href="/news" class="{% block nav_news %}{% endblock %}">Actus leaks</a>
      <a href="/reports" class="{% block nav_reports %}{% endblock %}">Rapports</a>
      <a href="/sources" class="{% block nav_sources %}{% endblock %}">Sources</a>
    </nav>
    <div style="flex:1"></div>
    {% if demo %}<div class="pill warn">Mode démo : données fictives</div>{% endif %}
    {% if request.state.user %}
    <form method="post" action="/logout" class="userbox">
      <span class="muted">{{ request.state.user.username }}</span>
      <button class="btn small" type="submit">Déconnexion</button>
    </form>
    {% endif %}
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
