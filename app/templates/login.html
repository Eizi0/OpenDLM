{% extends "auth_base.html" %}
{% block title %}{{ _("Sign in") }} · OpenDLM{% endblock %}
{% block content %}
<h1 style="font-size:22px">{{ _("Sign in") }}</h1>
{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="stack">
  <label for="username">{{ _("Username") }}</label>
  <input type="text" id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">{{ _("Password") }}</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button class="btn primary" type="submit" style="justify-content:center">{{ _("Sign in") }}</button>
</form>
{% endblock %}
