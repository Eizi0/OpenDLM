services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opendlm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opendlm}
      POSTGRES_DB: opendlm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendlm -d opendlm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Published image; without network access to it (or before the first release) Compose builds it from this folder.
    image: ghcr.io/eizi0/opendlm:${OPENDLM_VERSION:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENDLM_DATABASE_URL: postgresql+psycopg://opendlm:${POSTGRES_PASSWORD:-opendlm}@db:5432/opendlm
      OPENDLM_DEMO: ${OPENDLM_DEMO:-false}
      OPENDLM_SECRET_KEY: ${OPENDLM_SECRET_KEY:-}
      OPENDLM_LANGUAGE: ${OPENDLM_LANGUAGE:-en}
      OPENDLM_REQUIRE_2FA: ${OPENDLM_REQUIRE_2FA:-admins}
      OPENDLM_HIBP_API_KEY: ${OPENDLM_HIBP_API_KEY:-}
      OPENDLM_NOTIFY_URLS: ${OPENDLM_NOTIFY_URLS:-}
      OPENDLM_HEARTBEAT_URL: ${OPENDLM_HEARTBEAT_URL:-}
      OPENDLM_HUDSON_ROCK_KEY: ${OPENDLM_HUDSON_ROCK_KEY:-}
      OPENDLM_RANSOMWARE_LIVE_KEY: ${OPENDLM_RANSOMWARE_LIVE_KEY:-}
      OPENDLM_NEWS_INTERVAL_MINUTES: ${OPENDLM_NEWS_INTERVAL_MINUTES:-30}
      OPENDLM_NEWS_RETENTION_DAYS: ${OPENDLM_NEWS_RETENTION_DAYS:-90}
      OPENDLM_HISTORY_RETENTION_DAYS: ${OPENDLM_HISTORY_RETENTION_DAYS:-400}
      OPENDLM_AUDIT_RETENTION_DAYS: ${OPENDLM_AUDIT_RETENTION_DAYS:-365}
      OPENDLM_ALLOW_PRIVATE_FEEDS: ${OPENDLM_ALLOW_PRIVATE_FEEDS:-false}
      OPENDLM_REPORT_DAILY: ${OPENDLM_REPORT_DAILY:-true}
      OPENDLM_REPORT_MONTHLY: ${OPENDLM_REPORT_MONTHLY:-true}
      OPENDLM_REPORT_HOUR: ${OPENDLM_REPORT_HOUR:-7}
      OPENDLM_REPORT_SEND_EMPTY: ${OPENDLM_REPORT_SEND_EMPTY:-true}
      OPENDLM_ALERT_MIN_SEVERITY: ${OPENDLM_ALERT_MIN_SEVERITY:-low}
      OPENDLM_SCAN_HOUR: ${OPENDLM_SCAN_HOUR:-6}
      OPENDLM_TIMEZONE: ${OPENDLM_TIMEZONE:-Europe/Paris}
      OPENDLM_COOKIE_SECURE: ${OPENDLM_COOKIE_SECURE:-false}
      OPENDLM_TRUSTED_PROXIES: ${OPENDLM_TRUSTED_PROXIES:-}
    volumes:
      - appdata:/data
    # Local only; to expose it, go through an HTTPS reverse proxy.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  appdata:
